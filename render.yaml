services:
  - type: web
    name: youtube-clone
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: youtube-clone-uploads
      mountPath: /app/server/uploads
      sizeGB: 1
    envVars:
      - key: PORT
        value: "3000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        value: "3aae74d1363f6a4f2bac8718b4c9cd17f87ad48a785ec0b9f7ca879fa0160b04"
      - key: PEXELS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
